# Flutter 项目 CI 工作流。
# 本项目依赖 Flutter SDK（flutter_test 等），必须使用 Flutter 命令，
# 不能使用纯 Dart 命令（dart pub get 会因找不到 Flutter SDK 而失败）。

name: Flutter CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# 同一分支的新提交推送后，取消仍在跑的上一次检查，避免队列堆积浪费额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 固定 SDK 版本，避免 CI 跟着 stable 漂移导致「代码没改、CI 突然红」。
          # 具体原因：Flutter 3.48 起 `package:flutter/material.dart` 被标记废弃，
          # 要求迁移到 `package:material_ui/material_ui.dart`，在 --fatal-infos 下
          # 这一条会变成 56 个失败项。升级 Flutter 时应当连同这次迁移一起做，
          # 而不是让流水线自动升上去。
          flutter-version: '3.47.9'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze project source
        # info 级别提示同样视为失败，保持 lint 零告警
        run: flutter analyze --fatal-infos

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Check coverage threshold
        # 覆盖率下限，防止后续改动把整体覆盖率悄悄拉低。
        # 分母是 lcov 收录的可执行行（即被测试真正加载过的文件），
        # 因此新增一个 import 就会改变分母：路由测试 import 了 routes/index.dart，
        # 把全部页面文件一起载入统计，分母从 1732 涨到 3532 行。
        # 当前基线：3071 / 3532 行 = 86.9%（本地 3.47.9 实测，192 个用例）。
        # 门槛取 80%，比基线低近 5 个百分点，为平台与渲染差异留余量。
        run: |
          covered=$(awk -F'[:,]' '/^DA:/ && $3+0 > 0 { c++ } END { print c+0 }' coverage/lcov.info)
          total=$(awk -F'[:,]' '/^DA:/ { t++ } END { print t+0 }' coverage/lcov.info)
          echo "覆盖 $covered / $total 行"
          pct=$(awk -v c="$covered" -v t="$total" 'BEGIN { printf "%.1f", (t > 0 ? c * 100 / t : 0) }')
          echo "覆盖率 ${pct}%"
          awk -v p="$pct" 'BEGIN { if (p + 0 < 80) { print "覆盖率低于 80%，请补充测试"; exit 1 } }'

      - name: Build web (smoke)
        # 构建失败往往由资源路径、条件导入等问题引起，analyze 与 test 都发现不了
        run: flutter build web --release
