# Flutter 项目 CI 工作流。
# 本项目依赖 Flutter SDK（flutter_test 等），必须使用 Flutter 命令，
# 不能使用纯 Dart 命令（dart pub get 会因找不到 Flutter SDK 而失败）。

name: Flutter CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze project source
        # info 级别提示同样视为失败，保持 lint 零告警
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test
