# 移动端打包工作流：
# - Android：ubuntu runner 上产出 release APK（按 ABI 拆分）+ AAB
# - iOS：macOS runner 上产出「未签名」的 Runner.app 压缩包；配好签名 Secrets 后
#   打标签或手动触发还会额外产出可安装的 IPA
#
# 各 job 相互独立，任一失败不影响其它 job；产物都在 Actions 运行页的 Artifacts 区下载。
# 打 v* 标签（或手动触发并勾选 publish_release）时，publish-release job 会把产物汇总成一个
# GitHub Release，Releases 页面即可直接下载 apk / aab / ipa。
#
# 需要的 Secrets（都是可选的，没配就自动降级）：
#   ANDROID_KEYSTORE_BASE64      release keystore 的 base64（`base64 -w0 upload-keystore.jks`）
#   ANDROID_STORE_PASSWORD       密钥库口令
#   ANDROID_KEY_PASSWORD         密钥口令
#   ANDROID_KEY_ALIAS            密钥别名，缺省 upload
#   IOS_CERTIFICATE_BASE64       发布证书 .p12 的 base64
#   IOS_CERTIFICATE_PASSWORD     .p12 导出时的口令
#   IOS_PROVISIONING_PROFILE_BASE64  描述文件 .mobileprovision 的 base64
#   IOS_TEAM_ID                  Apple 开发者 Team ID（10 位）
# 可选变量（Repository variables，不是 Secret）：
#   IOS_BUNDLE_ID                要替换成的 Bundle Identifier，缺省沿用 com.example.hmShop
#   IOS_EXPORT_METHOD            导出方式，ad-hoc / app-store-connect，缺省 ad-hoc

name: Build Mobile

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  # 只改了文档/Web 的提交也想跳过移动端构建时，可在提交信息里加 [skip ci]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "构建完把安装包发到 GitHub Releases"
        type: boolean
        default: true
      release_tag:
        description: "发布用的 tag，留空则用 v1.0.0-build.<run number>"
        type: string
        required: false

# 同一分支只保留最新一次移动端构建，推送频繁时不至于把 runner 排队排满
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 先检查签名 Secrets 是否齐全：缺 iOS 签名时直接跳过签名 job，
  # 不再去排队等 macOS runner（排队排不到会被 GitHub 以 cancelled 收场，把整次运行染红）
  detect-signing:
    name: Detect signing secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android_signed: ${{ steps.check.outputs.android_signed }}
      ios_signed: ${{ steps.check.outputs.ios_signed }}
    steps:
      - name: Check secrets
        id: check
        env:
          HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_IOS_SIGNING: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' && secrets.IOS_TEAM_ID != '' }}
        run: |
          set -euo pipefail
          echo "android_signed=${HAS_ANDROID_KEYSTORE}" >> "$GITHUB_OUTPUT"
          echo "ios_signed=${HAS_IOS_SIGNING}" >> "$GITHUB_OUTPUT"
          echo "::notice::Android release 签名：${HAS_ANDROID_KEYSTORE}；iOS 签名：${HAS_IOS_SIGNING}"

  build-android:
    name: Android APK / AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # secrets 不能直接写在 if 里（GitHub 不允许），先落到 job 级 env 再判断
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        # AGP 9 / Kotlin 2.4 要求 JDK 17 及以上；runner 自带的 JDK 版本不固定，显式指定
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 与 dart.yml / web.yml 保持一致：固定 SDK 版本，避免 stable 漂移
          flutter-version: '3.47.9'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode release keystore
        # 有 ANDROID_KEYSTORE_BASE64 才写 key.properties；没有就跳过，构建自动退回 debug 签名
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'upload' }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties
          echo "::notice::已写入 android/key.properties，本次使用 release 签名"

      - name: Report signing config
        run: |
          if [ -f android/key.properties ]; then
            echo "::notice::签名配置：release（可上架应用商店）"
          else
            echo "::notice::签名配置：debug（可安装，不能上架；配置 ANDROID_KEYSTORE_BASE64 后自动切换）"
          fi

      - name: Build release APKs (split per ABI)
        # 拆成 arm64-v8a / armeabi-v7a / x86_64 三个包，单个体积比通用包小很多
        run: flutter build apk --release --split-per-abi

      - name: Build release App Bundle
        # 上传 Google Play 需要 AAB 而不是 APK
        run: flutter build appbundle --release

      - name: Verify APK signature
        # 把实际签名证书打出来，避免「以为配了正式签名、其实还走 debug」这种静默错误
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | head -3

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hm-shop-android
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: iOS (unsigned)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        # 项目使用 Swift Package Manager（无 Podfile），无需 pod install。
        # --no-codesign：没有开发者证书也能验证编译产物。
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app
        # .app 是目录，直接 zip 便于下载；用 zip -y 保留符号链接（框架里有）
        run: |
          cd build/ios/iphoneos
          zip -qry Runner.app.zip Runner.app
          ls -lh Runner.app.zip

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: hm-shop-ios-unsigned
          path: build/ios/iphoneos/Runner.app.zip
          if-no-files-found: error
          retention-days: 14

  build-ios-signed:
    name: iOS IPA (signed)
    needs: [ detect-signing ]
    # 签名包只在「打标签或手动触发」且「三个签名 Secret 齐全」时构建：
    # 缺 Secret 时连 runner 都不申请，避免白占 macOS runner 排队名额（排不到会 cancelled，把整次运行染红）
    if: |
      needs.detect-signing.outputs.ios_signed == 'true' &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # secrets 不能直接用在 if 里，先在 job 级 env 里算好「三个签名 Secret 是否齐全」
      HAS_IOS_SIGNING: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' && secrets.IOS_TEAM_ID != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Notice when signing secrets are missing
        if: env.HAS_IOS_SIGNING != 'true'
        run: echo "::notice::未配置 iOS 签名 Secrets（IOS_CERTIFICATE_BASE64 / IOS_PROVISIONING_PROFILE_BASE64 / IOS_TEAM_ID），本次跳过签名构建。"

      - name: Set up Flutter
        if: env.HAS_IOS_SIGNING == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Install dependencies
        if: env.HAS_IOS_SIGNING == 'true'
        run: flutter pub get

      - name: Install certificate and provisioning profile
        if: env.HAS_IOS_SIGNING == 'true'
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # 允许 codesign 在无人值守环境下访问私钥
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$PROFILE_DIR/profile.mobileprovision"

          PROFILE_NAME=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract Name raw -o - -)
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "::notice::已导入证书与描述文件：$PROFILE_NAME"

      - name: Build signed IPA
        if: env.HAS_IOS_SIGNING == 'true'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'ad-hoc' }}
        run: |
          set -euo pipefail

          # 工程里没有 DEVELOPMENT_TEAM，自动签名必须补上；这一步只改行内构建配置，不动代码
          /usr/bin/sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Automatic; DEVELOPMENT_TEAM = ${TEAM_ID};/g" \
            ios/Runner.xcodeproj/project.pbxproj
          if [ -n "${BUNDLE_ID}" ]; then
            /usr/bin/sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = com.example.hmShop;/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};/g" \
              ios/Runner.xcodeproj/project.pbxproj
          fi

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${EXPORT_METHOD}</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          flutter build ipa --release --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA
        if: env.HAS_IOS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hm-shop-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

  # 把上面几个 job 的产物汇总成一个 GitHub Release，方便直接在 Releases 页面下载安装包
  publish-release:
    name: Publish GitHub Release
    needs: [ build-android, build-ios ]
    # 打 v* 标签自动发版；也可以在 Actions 页手动触发并勾选 publish_release
    # 注意：inputs.publish_release 是 boolean 类型，不能跟字符串 'true' 比较（会被转成 NaN 而恒为 false）
    # always() + 只要求 Android 成功：macOS runner 排队排不到时 iOS job 会 cancelled，
    # 这时仍要把 Android 产物发出去，而不是让整次发布 skip 掉
    if: |
      always() &&
      needs.build-android.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/') || inputs.publish_release == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      # 只用来在 Release 说明里写清本次是正式签名还是 debug 签名
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_IOS_SIGNING: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' && secrets.IOS_TEAM_ID != '' }}

    steps:
      # gh release 需要在 git 仓库里运行（否则会报 fatal: not a git repository），先 checkout
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hm-shop-*
          path: dist
          merge-multiple: true

      - name: Resolve release tag
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          # 版本号以 pubspec.yaml 为唯一来源，避免 tag 与包内 versionName 不一致
          APP_VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1 | tr -d '\r')
          APP_VERSION_NAME="${APP_VERSION%%+*}"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$APP_VERSION_NAME" >> "$GITHUB_ENV"
          TAG="${INPUT_TAG:-}"
          if [ -z "$TAG" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              TAG="${GITHUB_REF#refs/tags/}"
            else
              TAG="v${APP_VERSION_NAME}-build.${GITHUB_RUN_NUMBER}"
            fi
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" > /dev/null 2>&1; then
            echo "TAG_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "TAG_EXISTS=false" >> "$GITHUB_ENV"
          fi
          echo "::notice::本次发布会使用的 tag：$TAG"

      - name: Compose release notes
        run: |
          set -euo pipefail
          ANDROID_SIGNING="debug 签名（配置了 ANDROID_KEYSTORE_BASE64 后会变成正式签名）"
          if [ "${HAS_ANDROID_KEYSTORE:-false}" = "true" ]; then
            ANDROID_SIGNING="release 签名"
          fi
          IOS_SIGNED="未包含签名 IPA（配置 iOS 签名 Secrets 后重新打标签即可产出）"
          if [ "${HAS_IOS_SIGNING:-false}" = "true" ]; then
            IOS_SIGNED="包含签名 IPA，可直接安装到描述文件里列出的设备"
          fi
          # macOS runner 排队排不到时 iOS job 会被 cancelled，这里如实标注产物是否缺失
          IOS_UNSIGNED="未包含（macOS runner 本次未成功，可重跑 Build Mobile 后重新上传）"
          if find dist -name 'Runner.app.zip' | grep -q .; then
            IOS_UNSIGNED="已包含"
          fi

          # 从 CHANGELOG.md 里抽出「## [1.0.1] - 2026-11-23」这种段落，作为 Release 说明的「本次更新」；
          # 抽不到（比如补丁版本没写日志）就整体省略，不阻断发布
          VERSION_NAME="${APP_VERSION_NAME:-}"
          CHANGELOG_SECTION=""
          if [ -n "$VERSION_NAME" ] && [ -f CHANGELOG.md ]; then
            CHANGELOG_SECTION=$(awk -v ver="$VERSION_NAME" '
              index($0, "## [" ver "]") == 1 { inside = 1; next }
              inside && index($0, "## [") == 1 { exit }
              inside { print }
            ' CHANGELOG.md | tr -d '\r' | cat -s | sed -e '/./,$!d')
          fi
          if [ -z "$CHANGELOG_SECTION" ]; then
            echo "::notice::CHANGELOG.md 里没有 ${VERSION_NAME} 的段落，Release 说明只包含安装包信息"
          fi

          { # 组内输出整体重定向：先「本次更新」，再安装包说明
            if [ -n "$CHANGELOG_SECTION" ]; then
              echo "## 本次更新（${VERSION_NAME}）"
              echo
              printf '%s\n\n' "$CHANGELOG_SECTION"
            fi
            cat <<NOTES
          ## 安装包

          | 文件 | 适用场景 |
          | --- | --- |
          | \`app-arm64-v8a-release.apk\` | 绝大多数现代安卓手机（首选） |
          | \`app-armeabi-v7a-release.apk\` | 较老的 32 位安卓设备 |
          | \`app-x86_64-release.apk\` | 安卓模拟器 / x86 平板 |
          | \`app-release.aab\` | 上架 Google Play 用 |
          | \`Runner.app.zip\` | iOS 未签名产物，需要用 Xcode 自行签名安装 |
          | \`*.ipa\` | iOS 签名包（存在时才上传） |

          - Android 签名：${ANDROID_SIGNING}
          - iOS：${IOS_SIGNED}
          - iOS 未签名产物（Runner.app.zip）：${IOS_UNSIGNED}

          ## 安装提示

          1. 直接在手机上点上面的 apk 下载，或先下载再传到手机安装；
          2. 首次安装需要在系统设置里允许「安装未知来源应用」；
          3. 如果手机是 arm64（2016 年以后的机型基本都是），装 \`arm64-v8a\` 那个即可，体积也最小。

          包内版本号：\`${APP_VERSION}\`（来自 \`pubspec.yaml\` 的 \`version\` 字段）。
          NOTES
          } > release-notes.md

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          # download-artifact 会保留上传时的相对路径（flutter-apk/、bundle/release/ 等），
          # 所以必须用 find 递归找，`dist/*.apk` 这种通配只能匹配到平铺的文件
          mapfile -t FILES < <(find dist -type f \( -name '*.apk' -o -name '*.aab' -o -name '*.zip' -o -name '*.ipa' \) | sort)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::没有找到可发布的产物，检查上游 job 是否成功（dist 内容见日志）"
            find dist -type f | head -20
            exit 1
          fi
          printf '待上传文件：\n'
          printf '  %s\n' "${FILES[@]}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release ${TAG} 已存在，改为覆盖上传资产"
            OUT=$(gh release upload "$TAG" "${FILES[@]}" --clobber --repo "$GITHUB_REPOSITORY" 2>&1) || {
              echo "::error::gh release upload 失败：$(echo "$OUT" | tr '\n' ' ' | cut -c1-800)"
              exit 1
            }
          else
            TARGET_ARGS=()
            if [ "$TAG_EXISTS" != "true" ]; then
              TARGET_ARGS=(--target "$GITHUB_SHA")
            fi
            OUT=$(gh release create "$TAG" "${FILES[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "HM Shop ${TAG}" \
              --notes-file release-notes.md \
              "${TARGET_ARGS[@]}" 2>&1) || {
              echo "::error::gh release create 失败：$(echo "$OUT" | tr '\n' ' ' | cut -c1-800)"
              exit 1
            }
          fi
          echo "::notice::安装包已发布：https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

