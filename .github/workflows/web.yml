# Web 打包与部署工作流：
# - push 到 master、PR 或手动触发时构建 Web 产物并上传 Artifact
# - 仅 push 到 master 或手动触发（且处于 master 分支）时自动部署到 GitHub Pages
#
# 使用前提：仓库 Settings -> Pages -> Build and deployment -> Source 选择 "GitHub Actions"

name: Build and Deploy Web

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 与 dart.yml 保持一致：固定 SDK 版本，避免 stable 漂移
          # （3.48 起 `package:flutter/material.dart` 废弃，见 dart.yml 的说明）
          flutter-version: '3.47.9'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build web
        # 项目站点地址为 https://<owner>.github.io/<repo>/，需要匹配仓库名子路径
        #
        # 想试 WebAssembly 产物可以在这行追加 `--wasm`：main.dart.wasm 比
        # main.dart.js 小约 15%，Chrome 下实测可正常渲染。但 skwasm 的多线程
        # 渲染需要 COOP/COEP 响应头，GitHub Pages 无法自定义响应头，因此默认
        # 仍用 JS 产物（详见 README 的「关于 --wasm」）。
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          flutter build web --release --base-href "/${REPO_NAME}/"

      - name: Add SPA fallback for deep links
        # 应用启用了真实路径策略（/goods 而非 #/goods），GitHub Pages 是把
        # 目录当静态文件服务的，直接访问深链会返回 404。用一份内容相同的
        # 404.html 兜底：页面被当作文档返回，Flutter 启动后再按地址栏路径恢复路由。
        run: cp build/web/index.html build/web/404.html

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: hm-shop-web
          path: build/web
          if-no-files-found: error
          retention-days: 14

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    # PR 只构建不部署；仅 master 分支的 push 或手动触发会发布
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
