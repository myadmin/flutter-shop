# Web 打包与部署工作流：
# - push 到 master、PR 或手动触发时构建 Web 产物并上传 Artifact
# - 仅 push 到 master 或手动触发（且处于 master 分支）时自动部署到 GitHub Pages
#
# 使用前提：仓库 Settings -> Pages -> Build and deployment -> Source 选择 "GitHub Actions"

name: Build and Deploy Web

on:
  push:
    branches: [ "master" ]
    # 纯文档改动不构建、不部署（页面内容不会变）
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # 按 ref 分组：以前统一用 `pages`，所有 PR 的构建挤在同一组里，
  # 后到的会把排队中的取消掉，依赖机器人一次开多个 PR 时就会出现成片 cancelled。
  # 部署只发生在 master，因此 master 上的部署仍然串行。
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-web:
    runs-on: ubuntu-latest
    # 构建 + 上传产物正常约 2-4 分钟；卡住时别占满默认 6 小时上限
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 与 dart.yml 保持一致：固定 SDK 版本，避免 stable 漂移
          # （3.48 起 `package:flutter/material.dart` 废弃，见 dart.yml 的说明）
          flutter-version: '3.47.9'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build web
        # 项目站点地址为 https://<owner>.github.io/<repo>/，需要匹配仓库名子路径
        #
        # 想试 WebAssembly 产物可以在这行追加 `--wasm`：main.dart.wasm 比
        # main.dart.js 小约 15%，Chrome 下实测可正常渲染。但 skwasm 的多线程
        # 渲染需要 COOP/COEP 响应头，GitHub Pages 无法自定义响应头，因此默认
        # 仍用 JS 产物（详见 README 的「关于 --wasm」）。
        #
        # `--no-wasm-dry-run`：构建末尾的 wasm dry-run 只用于提前提示 wasm 兼容性，
        # 会把提示写到 stderr，导致 CI 日志里出现「警告」、本地 PowerShell 甚至
        # 把它当失败（exit 1）。这里不需要它，直接关掉。
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          flutter build web --release --base-href "/${REPO_NAME}/" --no-wasm-dry-run

      - name: Strip engine symbol files
        # canvaskit 目录下的 6 个 *.js.symbols 合计约 8 MB，只在开发时用来把引擎
        # 堆栈还原成函数名（flutter symbolize / DevTools），部署产物完全用不到。
        # 删掉后 Web 产物从约 40 MB 降到约 32 MB。
        run: |
          find build/web -name '*.symbols' -print -delete
          du -sh build/web

      - name: Add SPA fallback for deep links
        # 应用启用了真实路径策略（/goods 而非 #/goods），GitHub Pages 是把
        # 目录当静态文件服务的，直接访问深链会返回 404。用一份内容相同的
        # 404.html 兜底：页面被当作文档返回，Flutter 启动后再按地址栏路径恢复路由。
        run: cp build/web/index.html build/web/404.html

      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: hm-shop-web
          path: build/web
          if-no-files-found: error
          retention-days: 14

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    # PR 只构建不部署；仅 master 分支的 push 或手动触发会发布
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build-web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
