name: hm_shop
description: "基于 Flutter 的商城示例应用：首页推荐（含新品首发 / 人气好物榜 / 品牌好店）、分类、商品详情、品牌详情、购物车、订单确认、订单管理、我的（收藏 / 足迹 / 个人资料 / 客服），支持 Web / Android / iOS。"
publish_to: 'none'

# 版本号格式：<versionName>+<versionCode>。修改后同步 CHANGELOG.md，
# 打 v<versionName> 标签即触发 Build Mobile 打包并把 CHANGELOG 对应段落写进 Release 说明。
version: 1.0.7+8

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  # 代码里没有直接使用 CupertinoIcons，但可达代码（GetX 内部组件）引用了该字体：
  # 删掉这个依赖后 `flutter build web` 会告警
  # "Expected to find fonts for (MaterialIcons, packages/cupertino_icons/CupertinoIcons)"，
  # 且相关图标会缺字形。tree-shaking 后仅占 1.4 KB，因此保留。
  cupertino_icons: ^1.0.8
  # 仅用于 Web 的 URL 策略（把地址栏从 #/goods 换成 /goods），
  # 由 lib/utils/web_url_strategy.dart 做条件导入，非 Web 平台不会编译到。
  flutter_web_plugins:
    sdk: flutter
  carousel_slider: ^5.1.2
  dio: ^5.11.1
  get: ^4.7.3
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 逐个声明资源文件，避免整目录声明把未使用的图片一起打进产物。
  # 新增图片时请在这里补一行。
  assets:
    - lib/assets/goods_avatar.png
    - lib/assets/home_cmd_inner.webp
    - lib/assets/home_cmd_sm.webp
    - lib/assets/ic_public_cart_active.png
    - lib/assets/ic_public_cart_normal.png
    - lib/assets/ic_public_home_active.png
    - lib/assets/ic_public_home_normal.png
    - lib/assets/ic_public_my_active.png
    - lib/assets/ic_public_my_normal.png
    - lib/assets/ic_public_pro_active.png
    - lib/assets/ic_public_pro_normal.png
    - lib/assets/ic_user_collect.png
    - lib/assets/ic_user_history.png
    - lib/assets/ic_user_obligation.png
    - lib/assets/ic_user_order.png
    - lib/assets/ic_user_service.png
    - lib/assets/ic_user_unevaluated.png
    - lib/assets/ic_user_unreceived.png
    - lib/assets/ic_user_unshipped.png
    - lib/assets/ic_user_vip.png
